<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/beercss@4.0.7/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@4.0.7/dist/cdn/beer.min.js"></script>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
    <title>Test plogging thing</title>
    <script src="./script.js" type="module"></script>
    <link rel="stylesheet" href="./styles.css">
</head>

<template id="card_template">
    <article class="border round no-padding">
        <img class="card_image responsive extra"
            src="./assets/Plogging_with_Coastal_Striders_-_FUNK9730_(42405061590).jpg">
        <div class="padding">
            <span class="center">
                <h5 class="card_date">Tuesday, January 1st, 2026</h5>
            </span>
            <span class=" center">
                <h3 class="card_clock clock">00:22</h3>
            </span>
            <span class="center">
                <h3 class="card_bags">1 bag</h3>
            </span>
        </div>
    </article>
</template>


<body>
    <main class="responsive">
        <div id="tab_activity" class="view_tab page padding active">
            <header class="v-margin-1"><span class="center">
                    <nav class="tabbed">
                        <h5 class="padding">Current activity</h5>
                    </nav>
                </span></header>
            <dialog id="activity_dialog" class="top">
                <h5>Top</h5>
                <div class="field label prefix border">
                    <i>attach_file</i>
                    <input id="activity_file_input" type="file">
                    <input type="text">
                    <label>Activity image</label>
                </div>
                <div class="field label prefix border">
                    <i>schedule</i>
                    <input id="activity_start_time_input" type="time">
                    <label>Start Time</label>
                </div>
                <div class="field label prefix border">
                    <i>schedule</i>
                    <input id="activity_end_time_input" type="time">
                    <label>End Time</label>
                </div>

                <div class="field label prefix border">
                    <i>numbers</i>
                    <input id="activity_bags_input" type="number">
                    <label>Bags</label>
                </div>


                <nav class="right-align">
                    <button type="button" id="close_activity_dialog" class="border">Cancel</button>
                    <button type="button" id="submit_activity_dialog">Confirm</button>
                </nav>
            </dialog>

            <div class="cards_list">
                <article class="border round no-padding">
                    <img class="responsive extra"
                        src="./assets/Plogging_with_Coastal_Striders_-_FUNK9730_(42405061590).jpg">
                    <div class="padding">
                        <span class="center">
                            <h5>Tuesday, January 1st, 2026</h5>
                        </span>
                        <span class="center">
                            <h3 class="clock">00:22</h3>
                        </span>
                        <span class="center">
                            <h3 class="">1 bag</h3>
                        </span>
                    </div>

                </article>

            </div>
            <button type="button" id="open_activity_dialog" class="add_button extend square">
                <i>add</i>
                <span>New Activity</span>
            </button>
        </div>
        <div id="tab_leaderboard" class="view_tab page padding">
            <header class="v-margin-1"><span class="center">
                    <nav class="tabbed">
                        <h5 class="padding">Leaderboard</h5>
                    </nav>
                </span></header>
            <article class="border round">
                <ul class="surface-background list border">
                    <li class="space-between wdith-100"><span>jimmy profile pic</span><span>Jimmy</span><span>3 bags</span></li>
                    <li>Item</li>
                    <li>Item</li>
                    <li>Item</li>
                </ul>
            </article>
        </div>
        <div id="tab_group" class="view_tab page padding">
            <h5>Guidelines</h5>
        </div>
        <div id="tab_settings" class="view_tab page padding">
            <h5>Acessibility</h5>
        </div>
    </main>
    <nav class="tabbed large bottom">
        <a id="nav_activity" class="active">
            <i>info</i>
            <span>Activity</span>
        </a>
        <a id="nav_leaderboard" class="">
            <i>style</i>
            <span>Leaderboard</span>
        </a>
        <a id="nav_group" class="">
            <i>design_services</i>
            <span>Guidelines</span>
        </a>
        <a id="nav_settings">
            <i>accessibility_new</i>
            <span>Acessibility</span>
        </a>
    </nav>


</body>

</html>
